<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f8fc"><meta name="description" content="Pixel-Art Studio — a modern visual design editor.">
<title>Pixel-Art Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>
</head>
<body>
<div class="app-shell">
<header class="topbar">
 <a class="brand" href="#" aria-label="Pixel-Art home"><span class="brand-mark">P</span><span>pixel<span class="brand-light">art</span></span></a>
 <div class="doc-title"><input id="projectName" value="Untitled design" aria-label="Project name"></div>
 <div class="top-actions"><span class="save-state" id="saveState">All changes saved</span><button class="btn btn-soft" id="undoBtn" title="Undo (Ctrl+Z)">↶</button><button class="btn btn-soft" id="redoBtn" title="Redo (Ctrl+Shift+Z)">↷</button><button class="btn btn-soft" id="langBtn">العربية</button><button class="btn btn-primary" id="exportBtn">Share / Export <span>↗</span></button></div>
</header>
<div class="editor-layout">
 <aside class="toolrail">
  <button class="tool active" data-panel="templates"><b>▦</b><span data-i18n="templates">Templates</span></button>
  <button class="tool" data-panel="elements"><b>◇</b><span data-i18n="elements">Elements</span></button>
  <button class="tool" data-panel="text"><b>T</b><span data-i18n="text">Text</span></button>
  <button class="tool" data-panel="uploads"><b>⇧</b><span data-i18n="uploads">Uploads</span></button>
  <button class="tool" data-panel="background"><b>◐</b><span data-i18n="background">Background</span></button>
  <button class="tool" data-panel="layers"><b>▤</b><span data-i18n="layers">Layers</span></button>
 </aside>
 <aside class="asset-panel" id="assetPanel">
  <div class="panel-heading"><div><h2 id="panelTitle">Templates</h2><p id="panelSub">Start with a layout you love</p></div><button class="close-panel" id="closePanel">×</button></div>
  <div class="panel-content" id="panelContent"></div>
 </aside>
 <main class="workspace">
  <div class="workspace-toolbar"><div class="crumb"><span class="dot"></span><span id="workspaceName">Untitled design</span><span class="crumb-muted">/ Page 1</span></div><div class="canvas-actions"><button class="mini-btn" id="zoomOut">−</button><span id="zoomLabel">100%</span><button class="mini-btn" id="zoomIn">+</button><button class="mini-btn" id="fitBtn" title="Fit canvas">⛶</button></div></div>
  <section class="stage" id="stage"><div class="canvas-frame"><canvas id="designCanvas" width="1080" height="1080"></canvas></div></section>
  <footer class="pages-bar"><div class="page-list" id="pageList"><button class="page-thumb selected" data-page="0"><span>1</span><small>Page 1</small></button></div><button class="add-page" id="addPage">＋ Add page</button><span class="page-spacer"></span><span class="canvas-size" id="canvasSize">1080 × 1080 px</span></footer>
 </main>
 <aside class="inspector" id="inspector"><div class="inspector-head"><h2 data-i18n="properties">Properties</h2><span id="selectionType">Page</span></div><div id="inspectorContent" class="inspector-content"></div></aside>
</div>
</div>
<div class="modal-backdrop" id="exportModal" hidden><section class="export-dialog"><button class="modal-close" id="closeExport">×</button><h2 data-i18n="exportTitle">Export your design</h2><p data-i18n="exportSub">Choose a format for your finished design.</p><label>File name<input id="exportName" value="pixel-art-design"></label><label>Format<select id="exportFormat"><option value="png">PNG image</option><option value="jpeg">JPG image</option><option value="svg">SVG vector</option><option value="json">Editable project (JSON)</option></select></label><label id="qualityRow">Quality <select id="exportScale"><option value="1">Standard (1×)</option><option value="2" selected>High (2×)</option><option value="3">Ultra (3×)</option></select></label><button class="btn btn-primary full" id="downloadBtn">Download design</button></section></div>
<input id="imageInput" type="file" accept="image/*" hidden><input id="projectInput" type="file" accept=".json,application/json" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="js/app.js"></script>
</body></html>
